name: AI Agent Orchestration

on:
  workflow_dispatch:

jobs:
  validate-agents:
    name: Validate AI Agents
    runs-on: ubuntu-latest

    env:
      OLLAMA_MODEL: llama3.2:1b

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Show available agents
        run: |
          echo "Available AI Agents:"
          ls -la agents/

      - name: Validate Python agent files
        run: |
          python -m compileall agents utils agent_core
      
      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama
        run: |
          ollama serve > /tmp/ollama.log 2>&1 &
          sleep 5

      - name: Pull Ollama model
        run: |
          ollama pull "$OLLAMA_MODEL"

      - name: Verify Ollama
        run: |
          ollama list

      - name: Run Threat Modeler Agent
        run: |
          echo "Starting Threat Modeler Agent..."
          python -m agents.threat_modeler
      
      - name: Verify Threat Model Report
        run: |
          echo "Checking generated threat report..."
          test -f reports/threat_report.md
          echo "Threat Model Report generated successfully."
          ls -lh reports/threat_report.md
      
      - name: Upload Threat Model Report
        uses: actions/upload-artifact@v6
        with:
          name: threat-model-report
          path: reports/threat_report.md
          if-no-files-found: error
      
      - name: Install SAST tools
        run: |
          pip install bandit semgrep

      - name: Prepare scan directory
        run: |
          mkdir -p scans
      
      - name: Run Bandit SAST Scan
        run: |
          bandit -r app -f json -o scans/bandit.json || true 

      - name: Run Semgrep SAST Scan
        run: |
          semgrep scan --config auto --json --output scans/semgrep.json app || true
     
      - name: Verify SAST Scan Reports
        run: |
          echo "Checking SAST scan reports..."
          test -f scans/bandit.json
          test -f scans/semgrep.json
          ls -lh scans/bandit.json
          ls -lh scans/semgrep.json
      
      - name: Run SAST Agent
        run: |
          echo "Starting SAST Agent..."
          python -m agents.sast_agent
      

      - name: Verify SAST Report
        run: |
          echo "Checking generated SAST report..."
          test -f reports/sast_report.md
          echo "SAST report generated successfully."
          ls -lh reports/sast_report.md
      
      - name: Upload SAST Report
        uses: actions/upload-artifact@v6
        with:
          name: sast-agent-report
          path: reports/sast_report.md
          if-no-files-found: error
    

          # -------------------------------------------------------
      # SCA Agent Orchestration
      # -------------------------------------------------------

      - name: Install Snyk CLI
        run: |
          sudo npm install -g snyk
          snyk --version

      - name: Run Snyk SCA Scan
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          mkdir -p scans
          snyk test --json > scans/snyk.json || true

      - name: Verify Snyk Report
        run: |
          test -f scans/snyk.json
          echo "Snyk report generated successfully."
          ls -lh scans/snyk.json

      - name: Run SCA Agent
        run: |
          echo "Starting SCA Agent..."
          python -m agents.sca_agent

      - name: Verify SCA Report
        run: |
          test -f reports/sca_report.md
          echo "SCA report generated successfully."
          ls -lh reports/sca_report.md

      - name: Upload SCA Report
        uses: actions/upload-artifact@v6
        with:
          name: sca-agent-report
          path: reports/sca_report.md
          if-no-files-found: error
      
      - name: Module 7 summary
        if: always()
        run: |
          echo "# Module 7 - AI Agent Orchestration" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "GitHub Actions successfully checked out the project." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "The Python environment and AI agent code were validated." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Ollama was configured with the CI model: $OLLAMA_MODEL." >> "$GITHUB_STEP_SUMMARY"