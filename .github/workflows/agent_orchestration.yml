name: AI Agent Orchestration

on:
  workflow_dispatch:

jobs:
  validate-agents:
    name: Validate AI Agents
    runs-on: ubuntu-latest

    env:
      OLLAMA_MODEL: llama3.2:1b

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Show available agents
        run: |
          echo "Available AI Agents:"
          ls -la agents/

      - name: Validate Python agent files
        run: |
          python -m compileall agents utils agent_core
      
      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama
        run: |
          ollama serve > /tmp/ollama.log 2>&1 &
          sleep 5

      - name: Pull Ollama model
        run: |
          ollama pull "$OLLAMA_MODEL"

      - name: Verify Ollama
        run: |
          ollama list

      - name: Run Threat Modeler Agent
        run: |
          echo "Starting Threat Modeler Agent..."
          python -m agents.threat_modeler
      
      - name: Verify Threat Model Report
        run: |
          echo "Checking generated threat report..."
          test -f reports/threat_report.md
          echo "Threat Model Report generated successfully."
          ls -lh reports/threat_report.md
      
      - name: Upload Threat Model Report
        uses: actions/upload-artifact@v6
        with:
          name: threat-model-report
          path: reports/threat_report.md
          if-no-files-found: error
      
      - name: Install SAST tools
        run: |
          pip install bandit semgrep

      - name: Prepare scan directory
        run: |
          mkdir -p scans
      
      - name: Run Bandit SAST Scan
        run: |
          bandit -r app -f json -o scans/bandit.json || true 

      - name: Run Semgrep SAST Scan
        run: |
          semgrep scan --config auto --json --output scans/semgrep.json app || true
     
      - name: Verify SAST Scan Reports
        run: |
          echo "Checking SAST scan reports..."
          test -f scans/bandit.json
          test -f scans/semgrep.json
          ls -lh scans/bandit.json
          ls -lh scans/semgrep.json
      
      - name: Run SAST Agent
        run: |
          echo "Starting SAST Agent..."
          python -m agents.sast_agent
      

      - name: Verify SAST Report
        run: |
          echo "Checking generated SAST report..."
          test -f reports/sast_report.md
          echo "SAST report generated successfully."
          ls -lh reports/sast_report.md
      
      - name: Upload SAST Report
        uses: actions/upload-artifact@v6
        with:
          name: sast-agent-report
          path: reports/sast_report.md
          if-no-files-found: error
    

          # -------------------------------------------------------
      # SCA Agent Orchestration
      # -------------------------------------------------------

      - name: Install Snyk CLI
        run: |
          sudo npm install -g snyk
          snyk --version

      - name: Run Snyk SCA Scan
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          mkdir -p scans
          snyk test --json > scans/snyk.json || true

      - name: Verify Snyk Report
        run: |
          test -f scans/snyk.json
          echo "Snyk report generated successfully."
          ls -lh scans/snyk.json

      - name: Run SCA Agent
        timeout-minutes: 10
        run: |
          echo "Starting SCA Agent..."
          python -u -m agents.sca_agent

      - name: Verify SCA Report
        run: |
          test -f reports/sca_report.md
          echo "SCA report generated successfully."
          ls -lh reports/sca_report.md

      - name: Upload SCA Report
        uses: actions/upload-artifact@v6
        with:
          name: sca-agent-report
          path: reports/sca_report.md
          if-no-files-found: error

          # -------------------------------------------------------
      # Pipeline Guard Agent Orchestration
      # -------------------------------------------------------

      - name: Install detect-secrets
        run: |
          pip install detect-secrets

      - name: Prepare Pipeline Guard input reports
        run: |
          mkdir -p reports

          echo "=== Bandit Security Scan ===" > reports/bandit_report.txt
          bandit -r app >> reports/bandit_report.txt 2>&1 || true

          echo "=== Secret Detection Scan ===" > reports/detect_secrets_report.txt
          detect-secrets scan >> reports/detect_secrets_report.txt 2>&1 || true

          echo "=== DAST / ZAP Security Report ===" > reports/zap_report.txt

          if [ -f reports/dast_report.md ]; then
            cat reports/dast_report.md >> reports/zap_report.txt
          else
            echo "No DAST report available in this CI run." >> reports/zap_report.txt
          fi

      - name: Verify Pipeline Guard inputs
        run: |
          test -f reports/bandit_report.txt
          test -f reports/detect_secrets_report.txt
          test -f reports/zap_report.txt

          echo "Pipeline Guard input reports are ready."

          ls -lh reports/bandit_report.txt
          ls -lh reports/detect_secrets_report.txt
          ls -lh reports/zap_report.txt

      - name: Run Pipeline Guard Agent
        timeout-minutes: 10
        run: |
          echo "Starting Pipeline Guard Agent..."
          python -u -m agents.pipeline_guard

      - name: Verify Pipeline Security Report
        run: |
          test -f reports/pipeline_security_report.md
          echo "Pipeline security report generated successfully."
          ls -lh reports/pipeline_security_report.md

      - name: Upload Pipeline Guard Report
        uses: actions/upload-artifact@v6
        with:
          name: pipeline-guard-report
          path: reports/pipeline_security_report.md
          if-no-files-found: error
      
            # -------------------------------------------------------
      # Container Hardener Agent Orchestration
      # -------------------------------------------------------

      - name: Build Calculator Docker Image
        run: |
          echo "Building Calculator Docker image..."
          docker build \
            -t ai-devsecops-calculator:ci \
            .

      - name: Verify Docker Image
        run: |
          docker images ai-devsecops-calculator:ci

      - name: Install Trivy
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            wget \
            apt-transport-https \
            gnupg \
            lsb-release

          wget -qO - \
            https://aquasecurity.github.io/trivy-repo/deb/public.key \
            | gpg --dearmor \
            | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null

          echo \
            "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" \
            | sudo tee /etc/apt/sources.list.d/trivy.list

          sudo apt-get update
          sudo apt-get install -y trivy

          trivy --version

      - name: Run Trivy Container Image Scan
        run: |
          mkdir -p scans

          trivy image \
            --format json \
            --output scans/container-trivy.json \
            ai-devsecops-calculator:ci \
            || true

      - name: Verify Trivy Container Report
        run: |
          test -f scans/container-trivy.json

          echo "Trivy container report generated successfully."

          ls -lh scans/container-trivy.json

      - name: Run Container Hardener Agent
        timeout-minutes: 10
        run: |
          echo "Starting Container Hardener Agent..."
          python -u -m agents.container_hardener

      - name: Verify Container Security Report
        run: |
          test -f reports/container_security_report.md

          echo "Container security report generated successfully."

          ls -lh reports/container_security_report.md

      - name: Upload Container Hardener Report
        uses: actions/upload-artifact@v6
        with:
          name: container-hardener-report
          path: reports/container_security_report.md
          if-no-files-found: error
      
      - name: Module 7 summary
        if: always()
        run: |
          echo "# Module 7 - AI Agent Orchestration" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "GitHub Actions successfully checked out the project." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "The Python environment and AI agent code were validated." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Ollama was configured with the CI model: $OLLAMA_MODEL." >> "$GITHUB_STEP_SUMMARY"