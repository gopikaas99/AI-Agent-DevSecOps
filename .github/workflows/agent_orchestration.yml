name: AI Agent Orchestration

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "agents/**"
      - "prompts/**"
      - "reports/**"
      - "scans/**"
      - ".github/workflows/agent_orchestration.yml"

jobs:

  validate-agents:
    name: Validate AI Agents
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # Environment Setup
      # --------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # --------------------------------------------------
      # Validate Agent Source Files
      # --------------------------------------------------

      - name: Show available agents
        run: |
          echo "Available AI Agents:"
          ls -la agents/

      - name: Validate Python agent files
        run: |
          python -m compileall agents utils

      # --------------------------------------------------
      # Threat Modeler
      # --------------------------------------------------

      - name: Validate Threat Modeler Agent
        run: |
          echo "Validating Threat Modeler Agent..."
          test -f agents/threat_modeler.py
          test -f reports/threat_report.md
          echo "Threat Modeler Agent validated."

      # --------------------------------------------------
      # SAST
      # --------------------------------------------------

      - name: Validate SAST Agent
        run: |
          echo "Validating SAST Agent..."
          test -f agents/sast_agent.py
          test -f reports/sast_report.md
          echo "SAST Agent validated."

      # --------------------------------------------------
      # SCA
      # --------------------------------------------------

      - name: Validate SCA Agent
        run: |
          echo "Validating SCA Agent..."
          test -f agents/sca_agent.py
          test -f reports/sca_report.md
          echo "SCA Agent validated."

      # --------------------------------------------------
      # DAST
      # --------------------------------------------------

      - name: Validate DAST Agent
        run: |
          echo "Validating DAST Agent..."

          test -f agents/dast_agent.py
          test -f prompts/dast_prompt.txt
          test -f scans/zap_report.json
          test -f reports/dast_report.md

          echo "DAST Agent validated."
          echo "OWASP ZAP scan input found."
          echo "AI-assisted DAST report found."

      # --------------------------------------------------
      # Pipeline Guard
      # --------------------------------------------------

      - name: Validate Pipeline Guard Agent
        run: |
          echo "Validating Pipeline Guard Agent..."
          test -f agents/pipeline_guard.py
          test -f reports/pipeline_security_report.md
          echo "Pipeline Guard Agent validated."

      # --------------------------------------------------
      # Container Hardener
      # --------------------------------------------------

      - name: Validate Container Hardener Agent
        run: |
          echo "Validating Container Hardener Agent..."
          test -f agents/container_hardener.py
          test -f reports/container_security_report.md
          echo "Container Hardener Agent validated."

      # --------------------------------------------------
      # Policy Agent
      # --------------------------------------------------

      - name: Validate Policy Agent
        run: |
          echo "Validating Policy Agent..."
          test -f agents/policy_agent.py
          test -f reports/kubernetes_policy_report.md
          echo "Policy Agent validated."

      # --------------------------------------------------
      # Display Reports
      # --------------------------------------------------

      - name: Show generated reports
        run: |
          echo "Generated security reports:"
          ls -la reports/

      # --------------------------------------------------
      # GitHub Job Summary
      # --------------------------------------------------

      - name: Generate orchestration summary
        run: |
          echo "# AI Agent DevSecOps Orchestration" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "## Environment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- GitHub-hosted runner: ubuntu-latest" >> $GITHUB_STEP_SUMMARY
          echo "- Python environment: 3.12" >> $GITHUB_STEP_SUMMARY
          echo "- Local AI model used for generated AI reports: Ollama llama3.1:8b" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "## Orchestrated AI Security Agents" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Agent | Security Purpose | Generated Report |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Threat Modeler Agent | Threat modeling | reports/threat_report.md |" >> $GITHUB_STEP_SUMMARY
          echo "| SAST Agent | Static code security analysis | reports/sast_report.md |" >> $GITHUB_STEP_SUMMARY
          echo "| SCA Agent | Dependency vulnerability analysis | reports/sca_report.md |" >> $GITHUB_STEP_SUMMARY
          echo "| DAST Agent | Dynamic application security analysis using OWASP ZAP findings | reports/dast_report.md |" >> $GITHUB_STEP_SUMMARY
          echo "| Pipeline Guard Agent | Pipeline security assessment | reports/pipeline_security_report.md |" >> $GITHUB_STEP_SUMMARY
          echo "| Container Hardener Agent | Container image security | reports/container_security_report.md |" >> $GITHUB_STEP_SUMMARY
          echo "| Policy Agent | Kubernetes policy security | reports/kubernetes_policy_report.md |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "## Final Result" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "GitHub Actions validated the selected AI-assisted DevSecOps security stages and collected their generated security reports." >> $GITHUB_STEP_SUMMARY

      # --------------------------------------------------
      # Upload Individual Reports
      # --------------------------------------------------

      - name: Upload DAST Agent report
        uses: actions/upload-artifact@v4
        with:
          name: dast-agent-report
          path: reports/dast_report.md

      - name: Upload Pipeline Guard report
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-guard-report
          path: reports/pipeline_security_report.md

      - name: Upload Container Hardener report
        uses: actions/upload-artifact@v4
        with:
          name: container-hardener-report
          path: reports/container_security_report.md

      - name: Upload Policy Agent report
        uses: actions/upload-artifact@v4
        with:
          name: policy-agent-report
          path: reports/kubernetes_policy_report.md

      # --------------------------------------------------
      # Upload Complete Security Report Collection
      # --------------------------------------------------

      - name: Upload all AI DevSecOps security reports
        uses: actions/upload-artifact@v4
        with:
          name: ai-devsecops-security-reports
          path: reports/